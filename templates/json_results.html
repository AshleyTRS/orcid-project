<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Viewer - UAEH Researchers Network</title>
    <link rel="stylesheet" href="/static/styles/main.css">
</head>

<body>
    {% include '_header.html' %}

    <main class="container">
        <div class="page-header">
            <h1 class="page-title">Co-authorship API</h1>
            <p class="page-subtitle">Fetch raw JSON from <code>/api/coauthorship</code> for a range of years.</p>
        </div>

        <section class="card">
            <div class="toolbar">
                <div class="field">
                    <label class="field-label" for="startYear">Start year</label>
                    <input class="input" id="startYear" type="number" value="2020" min="1900" max="2100">
                </div>
                <div class="field">
                    <label class="field-label" for="endYear">End year</label>
                    <input class="input" id="endYear" type="number" value="2026" min="1900" max="2100">
                </div>
                <button type="button" class="btn btn-primary" id="fetchBtn">Fetch JSON</button>
                <a href="/network" class="btn btn-secondary">View network</a>
                <div class="toolbar-spacer"></div>
                <div class="status-text" id="status" role="status">Ready</div>
            </div>

            <pre class="json-output" id="jsonOutput">{}</pre>
        </section>
    </main>

    <script>
        const statusEl = document.getElementById('status');
        const outputEl = document.getElementById('jsonOutput');
        const startYearEl = document.getElementById('startYear');
        const endYearEl = document.getElementById('endYear');
        const fetchBtn = document.getElementById('fetchBtn');

        function fetchJson() {
            const start = startYearEl.value;
            const end = endYearEl.value;
            const url = `/api/coauthorship?startYear=${encodeURIComponent(start)}&endYear=${encodeURIComponent(end)}`;
            statusEl.textContent = `Fetching ${url} ...`;
            fetch(url)
                .then(resp => resp.json())
                .then(data => {
                    outputEl.textContent = JSON.stringify(data, null, 2);
                    statusEl.textContent = `Fetched ${Object.keys(data).length} top-level keys at ${new Date().toLocaleTimeString()}`;
                })
                .catch(err => {
                    outputEl.textContent = JSON.stringify({ error: err.message || err }, null, 2);
                    statusEl.textContent = 'Error fetching data';
                });
        }

        fetchBtn.addEventListener('click', fetchJson);

        fetchJson();
    </script>
</body>

</html>
